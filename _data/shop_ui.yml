# _data/shop_ui.yml  -  TRADUZIONI DELL'INTERFACCIA DELLO SHOP (stile "string translation" di WPML/Polylang)
# Chiave di primo livello = codice lingua (come in _config.yml > languages). Sotto: "testo italiano": "traduzione".
# Come funziona: assets/js/shop-i18n.js sostituisce nel browser i testi italiani dello shop (pagine, carrello,
# pop-up, errori) con questa tabella. Il testo ITALIANO e' la chiave: NON cambiarlo nei template senza cambiarlo qui.
# Chiave mancante = resta in italiano (fallback). Nuova lingua: copia il blocco "en:" e traduci i valori.
# Nomi, descrizioni e categorie dei prodotti NON stanno qui: sono nel campo "tr" di _data/catalogo.json.
# Le chiavi che iniziano con spazio (" prodotti") servono per i conteggi: non toglierlo.
# =====================================================================================
